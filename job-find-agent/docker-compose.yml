services:
  # Database Service: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: job-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent_secret
      POSTGRES_DB: jobagent_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Job-Finding Agent (Scout Agent Microservice)
  scout_agent:
    build:
      context: .
      dockerfile: scout_agent/Dockerfile
    container_name: scout-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AGENT_NAME=scout_agent
      - AGENT_MODEL=${SCOUT_LLM:-ollama/qwen2.5:7b}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - IN_DOCKER=true
      - DATA_DIR=/app/data
    volumes:
      - ./scout_agent:/app/scout_agent
      - ./shared:/app/shared
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"

  # Backend & Manager Agent Service: FastAPI + Orchestrator
  backend:
    image: job-agent-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job-agent-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DISPLAY=:99
      - DATABASE_URL=postgresql+asyncpg://jobagent:jobagent_secret@db:5432/jobagent_db
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEFAULT_MODEL=auto
      - DATA_DIR=/app/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./shared:/app/shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"

volumes:
  pgdata:
    driver: local
